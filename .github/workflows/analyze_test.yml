name: Analyze & Test

on:
    push:
        paths-ignore:
            - "**.md"
    workflow_dispatch:

jobs:
    analyze-test:
        name: Analyze & Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Pub get
              run: flutter pub get

            - name: Analyze
              run: flutter analyze

            - name: Test
              run: flutter test
