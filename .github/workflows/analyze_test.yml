name: Analyze & Test

on:
    push:
        paths-ignore:
            - "**.md"
    workflow_dispatch:

jobs:
    analyze-test:
        name: Analyze & Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Pub get
              run: flutter pub get

            - name: Analyze
              # --no-fatal-infos: the vendored lib/common/widgets/flutter/* copies
              # carry many pre-existing info-level lints; still fail on real
              # warnings/errors in our own code.
              run: flutter analyze --no-fatal-infos

            - name: Test
              run: flutter test
